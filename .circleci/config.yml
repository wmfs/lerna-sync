version: 2.1
jobs:
  unit-test:
    docker:
      - image: cimg/node:lts
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
        environment:
          TZ: "Europe/London"
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package.json" }}
            - v1-deps-
      - run:
          name: install
          command: npm install
      - save_cache:
          key: v1-deps-{{ checksum "package.json" }}
          paths:
            - node_modules
      - run:
          name: test
          command: npm test
      - run:
          name: codecov
          command: npm run coverage
  lint:
    docker:
      - image: cimg/node:lts
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: install standard
          command: npm install standard
      - run:
          name: lint
          command: npm run lint
  release:
    docker:
      - image: cimg/node:lts
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
        environment:
          TZ: "Europe/London"
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package.json" }}
            - v1-deps-
      - run:
          name: install
          command: npm install
      - save_cache:
          key: v1-deps-{{ checksum "package.json" }}
          paths:
            - node_modules
      - run:
          name: get github app token
          command: |
            node -e '
              const crypto = require("crypto");
              const key = Buffer.from(process.env.GH_APP_PRIVATE_KEY_B64, "base64").toString();
              const b64 = o => Buffer.from(JSON.stringify(o)).toString("base64url");
              const now = Math.floor(Date.now() / 1000);
              const unsigned = b64({ alg: "RS256", typ: "JWT" }) + "." +
                b64({ iat: now - 60, exp: now + 540, iss: process.env.GH_APP_ID });
              const jwt = unsigned + "." + crypto.sign("RSA-SHA256", Buffer.from(unsigned), key).toString("base64url");
              const headers = { Authorization: `Bearer ${jwt}`, Accept: "application/vnd.github+json" };
              const repo = `${process.env.CIRCLE_PROJECT_USERNAME}/${process.env.CIRCLE_PROJECT_REPONAME}`;
              (async () => {
                const inst = await (await fetch(`https://api.github.com/repos/${repo}/installation`, { headers })).json();
                const res = await (await fetch(`https://api.github.com/app/installations/${inst.id}/access_tokens`, { method: "POST", headers })).json();
                if (!res.token) { console.error(inst, res); process.exit(1); }
                console.log(`export GH_TOKEN=${res.token}`);
                console.log(`export GIT_CREDENTIALS=x-access-token:${res.token}`);
              })();
            ' >> "$BASH_ENV"
      - run:
          name: release
          command: npx semantic-release
workflows:
  test_and_release:
    jobs:
      - unit-test:
          context:
            - docker-hub-creds
            - build-env-vars
      - lint:
          context:
            - docker-hub-creds
      - release:
          context:
            - docker-hub-creds
            - build-env-vars
          requires:
            - unit-test
            - lint
          filters:
            branches:
              only: master
